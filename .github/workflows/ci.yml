name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r dispatcher/requirements.txt pytest pyyaml
      - run: pytest tests/ -v
      - name: validate golden set
        run: python -c "import importlib.util,pathlib; spec=importlib.util.spec_from_file_location('h','evals/harness.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print(len(m.load_golden()),'golden cases valid')" 
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./dispatcher
